services:
  db:
    image: postgres:16
    container_name: incident_db
    environment:
      POSTGRES_DB: incidents_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d incidents_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: incident_api
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/code
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/incidents_db
      TESTING: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: